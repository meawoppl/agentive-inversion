[package]
name = "backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shared-types = { path = "../shared-types", features = ["diesel"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# Database
diesel.workspace = true
diesel-async.workspace = true
diesel_migrations.workspace = true

# Web framework
axum.workspace = true
tower.workspace = true
tower-http.workspace = true

# Environment and config
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12.24", features = ["json"] }
urlencoding = "2.1.3"
tokio-postgres-rustls = "0.13.0"
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.4"
futures = "0.3.31"
tokio-postgres = "0.7.15"
clap = { version = "4.5.53", features = ["derive", "env"] }
# Gmail polling (consolidated from email-poller crate)
google-gmail1 = "6.0.0"
yup-oauth2 = "12.1.1"
base64 = "0.22.1"
regex = "1"
hyper = { version = "1.8.1", features = ["client"] }
hyper-util = { version = "0.1.18", features = ["client-legacy"] }
async-trait = "0.1.89"
jsonwebtoken = "9"
cookie = "0.18"
google-calendar3 = "6.0.0"
claude-codes = { git = "https://github.com/meawoppl/rust-code-agent-sdks", rev = "984ea30538d4fb80a07812a522217877dfb1e00b", features = ["auth"] }
tempfile = "3.27.0"

# Pre-compressed static frontend assets (brotli/gzip, ETag/304, SPA fallback).
# memory-serve 0.6.x is the axum-0.7 compatible line (2.x requires axum 0.8+).
memory-serve = "0.6"
# Pin alloc-stdlib: 0.2.3 bumped its alloc-no-stdlib dep to 3.0, which clashes
# with brotli-decompressor 4.0.3 (still on alloc-no-stdlib 2.x) inside
# memory-serve's brotli 6. Holding 0.2.2 keeps the graph on one version.
alloc-stdlib = "=0.2.2"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "agent-cli"
path = "src/bin/agent_cli.rs"
