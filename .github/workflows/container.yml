name: Build and Push Container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Pinned so a trunk release cannot silently change the wasm output.
  TRUNK_VERSION: v0.21.14

jobs:
  build-release:
    name: Build Release Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release"

      # Installed from a prebuilt binary: building trunk from source broke
      # upstream.
      - name: Install Trunk
        run: wget -qO- "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xzf- -C ~/.cargo/bin

      # Must precede the backend build: memory-serve embeds crates/frontend/dist
      # into the binary at compile time.
      - name: Build frontend (release)
        run: cd crates/frontend && trunk build --release

      - name: Build binaries (backend embeds frontend assets and migrations)
        run: cargo build --release --locked --bin backend --bin agent-cli

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: backend-linux-x86_64
          path: |
            target/release/backend
            target/release/agent-cli
          retention-days: 7

  container:
    name: Build Container
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          name: backend-linux-x86_64
          path: target/release

      - name: Make binaries executable
        run: chmod +x target/release/backend target/release/agent-cli

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `type=ref,event=branch` produces the `:main` tag that watchtower
          # polls on the production host. Do not remove it.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
