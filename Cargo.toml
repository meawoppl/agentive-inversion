[workspace]
resolver = "2"
members = [
    "crates/frontend",
    "crates/backend",
    "crates/shared-types",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["meawoppl"]
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4", "js"] }
thiserror = "1.0"
anyhow = "1.0"

# Database
# diesel is held at 2.1 by diesel-async 0.4 (`diesel = "~2.1.1"`); moving to
# diesel 2.3 requires a diesel-async 0.4 -> 0.9 upgrade of the async pool and
# the custom TLS setup in db.rs. Tracked in issue #91.
diesel = { version = "2.1", features = ["postgres", "r2d2", "chrono", "uuid", "serde_json"] }
diesel-async = { version = "0.4", features = ["postgres", "deadpool"] }
diesel_migrations = "2.1"

# Web
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Frontend
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = "0.3"
gloo = "0.11"
